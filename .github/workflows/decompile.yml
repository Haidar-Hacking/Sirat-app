name: Decompile 3.1.1
on:
  push:
    branches: [decompile]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Tools
        run: |
          curl -sL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
          curl -sL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
      - name: Decompile
        run: |
          rm -rf out && mkdir out
          jadx/bin/jadx --no-res -d out/jadx sirat-almuminin.apk || true
          java -jar apktool.jar d -s -f -o out/apktool sirat-almuminin.apk
          rm -rf out/apktool/assets out/apktool/classes.dex out/apktool/original/META-INF
          ls $ANDROID_HOME/build-tools > out/build-tools.txt
          find out -type f | head -200
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out
          git commit -m "decompiled output" -q
          git push origin HEAD:decompile
