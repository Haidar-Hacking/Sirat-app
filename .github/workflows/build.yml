# يبني تطبيق صراط المؤمنين عند كل تعديل في مجلد android:
#   - sirat-almuminin.apk  (نسخة GitHub، تحدّث نفسها)
#   - sirat-almuminin.aab  (لمتجر Google Play)
# إذا كان سرّا التوقيع KEYSTORE_B64 وKEYSTORE_PASSWORD موجودين في إعدادات المستودع،
# يوقّع الملفين وينشر APK وversion.json في الفرع main فيصل التحديث للمستخدمين تلقائياً،
# ويضع الملفين في صفحة Releases.
# بدون السرّين يرفع الملفين غير موقّعين إلى الفرع builds ليُوقَّعا يدوياً.
name: Build app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sirat.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sirat.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Build APK and AAB
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleGithubRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Collect files
        run: |
          mkdir -p out
          V=$(grep -m1 'def appVersionName' android/app/build.gradle | sed -E 's/.*"([0-9.]+)".*/\1/')
          C=$(grep -m1 'def appVersionCode' android/app/build.gradle | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "APP_CODE=$C" >> "$GITHUB_ENV"
          grep -q "var APP_VERSION='$V';" android/app/src/main/assets/www/index.html || { echo "APP_VERSION in index.html does not match $V"; exit 1; }
          cp android/app/build/outputs/apk/github/release/*.apk out/sirat-almuminin.apk
          cp android/app/build/outputs/bundle/playRelease/*.aab out/sirat-almuminin.aab
          if [ "$SIGNED" = "0" ]; then
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            mkdir -p out/tools
            cp $BT/lib/apksigner.jar $BT/zipalign out/tools/ || true
          fi
          ls -la out

      - name: Unsigned build to the builds branch
        if: env.SIGNED == '0'
        run: |
          cd out
          git init -q -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Unsigned build ${APP_VERSION} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Publish the update (APK and version.json)
        if: env.SIGNED == '1'
        run: |
          cp out/sirat-almuminin.apk sirat-almuminin.apk
          python3 - <<'PY'
          import json, os
          notes = [l.strip() for l in open('android/release-notes.txt', encoding='utf-8') if l.strip()]
          v = {"version": os.environ["APP_VERSION"], "code": int(os.environ["APP_CODE"]),
               "apk": "https://github.com/Haidar-Hacking/Sirat-app/raw/main/sirat-almuminin.apk", "notes": notes}
          open('version.json', 'w', encoding='utf-8').write(json.dumps(v, ensure_ascii=False, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sirat-almuminin.apk version.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "الإصدار ${APP_VERSION} [skip ci]"
          git push

      - name: Releases page
        if: env.SIGNED == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: صراط المؤمنين ${{ env.APP_VERSION }}
          body_path: android/release-notes.txt
          files: |
            out/sirat-almuminin.apk
            out/sirat-almuminin.aab
          make_latest: true
